services:
  - type: web
    name: stellar-golf-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    rootDir: backend
    envVars:
      - key: STELLAR_RUNTIME
        value: "render"
      - key: STELLAR_PROV3_USE_FAST_240FPS
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOLF_NEWS_API_KEY
        sync: false
    plan: free
    healthCheckPath: /health
