# Rerequest failed Cloudflare (Pages) GitHub Check Runs on recent commits — no local CLI.
# Uses per-check-run rerequest (check-suites rerequest often fails for third-party apps with GITHUB_TOKEN).
# GitHub → Actions → "Rerun failed Cloudflare checks" → Run workflow.
name: Rerun failed Cloudflare checks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan (commit history from tip)"
        required: true
        default: "main"
      depth:
        description: "How many commits to scan from branch tip"
        required: true
        default: "80"

permissions:
  checks: write
  contents: read

jobs:
  rerequest:
    runs-on: ubuntu-latest
    steps:
      - name: Rerequest failed Cloudflare check runs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "${{ github.event.inputs.branch }}".trim() || "main";
            const depth = Math.min(500, Math.max(1, parseInt("${{ github.event.inputs.depth }}", 10) || 80));

            const runIds = new Set();
            let page = 1;
            const perPage = Math.min(100, depth);
            let collected = 0;
            const seenShas = [];

            while (collected < depth) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: branch,
                per_page: perPage,
                page,
              });
              if (!commits.length) break;
              for (const c of commits) {
                if (collected >= depth) break;
                seenShas.push(c.sha);
                collected++;
                const { data: runsData } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: c.sha,
                  per_page: 100,
                });
                for (const run of runsData.check_runs || []) {
                  if (run.conclusion !== "failure") continue;
                  const appName = (run.app && run.app.name ? String(run.app.name) : "").toLowerCase();
                  if (!appName.includes("cloudflare")) continue;
                  const rid = run.id;
                  if (rid != null) runIds.add(Number(rid));
                }
              }
              if (commits.length < perPage) break;
              page++;
            }

            core.info(`Scanned ${seenShas.length} commit(s) on ${branch}; unique failed Cloudflare check_run id(s): ${runIds.size}`);

            let ok = 0;
            let bad = 0;
            for (const check_run_id of runIds) {
              try {
                await github.request("POST /repos/{owner}/{repo}/check-runs/{check_run_id}/rerequest", {
                  owner,
                  repo,
                  check_run_id,
                });
                core.info(`rerequest ok: check_run_id=${check_run_id}`);
                ok++;
                await new Promise((r) => setTimeout(r, 400));
              } catch (e) {
                core.warning(`rerequest failed run ${check_run_id}: ${e.message}`);
                bad++;
              }
            }
            core.info(`Done. ok=${ok} failed=${bad}`);
