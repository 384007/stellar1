# 说明：
# - 不能删除 Git commit 本身；本 workflow 只删 GitHub Actions 的「失败/取消/超时」运行记录。
# - Cloudflare / 其它 App 写的 Check，不能用本任务删除，要在对应平台处理。
#
# Actions → "Cleanup failed deploy runs" → Run workflow（默认会清理仓库内「所有」workflow 的失败 run）
name: Cleanup failed deploy runs

on:
  workflow_dispatch:
    inputs:
      delete_all_failed_runs:
        description: "删除整个仓库里所有 workflow 的失败类 run（默认开）；关则只删 deploy-* + 本 cleanup"
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  checks: read
  statuses: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLEANUP_ALL_FAILED: ${{ inputs.delete_all_failed_runs }}
    steps:
      - name: Delete failed Actions runs (full history pagination) + diagnose HEAD
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const wipeAll = process.env.CLEANUP_ALL_FAILED === "true";
            const deployPathRe = /^\.github\/workflows\/deploy-[^/]+\.yml$/;
            const extraPaths = new Set([
              ".github/workflows/cleanup-failed-modal-runs.yml",
            ]);
            const badConclusions = new Set([
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
            ]);

            function shouldDeletePath(p) {
              if (wipeAll) return true;
              if (extraPaths.has(p)) return true;
              return deployPathRe.test(p);
            }

            async function collectIdsToDelete() {
              const ids = [];
              for (let page = 1; ; page++) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  per_page: 100,
                  page,
                });
                const runs = data.workflow_runs || [];
                for (const r of runs) {
                  const p = r.path || "";
                  if (!shouldDeletePath(p)) continue;
                  if (!badConclusions.has(r.conclusion)) continue;
                  ids.push(r.id);
                }
                if (runs.length < 100) break;
              }
              return ids;
            }

            // Multi-pass: after deletes, listing can shift; repeat until nothing left
            let totalDeleted = 0;
            let round = 0;
            while (round < 50) {
              round++;
              const ids = await collectIdsToDelete();
              if (!ids.length) break;
              for (const run_id of ids) {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
              }
              totalDeleted += ids.length;
              core.info(`Round ${round}: deleted ${ids.length} run(s)`);
            }
            core.info(
              `${wipeAll ? "WIPE_ALL" : "scoped deploy-*"}: total deleted ${totalDeleted} run(s) in ${round - 1} round(s)`,
            );

            const { data: rep } = await github.rest.repos.get({ owner, repo });
            const def = rep.default_branch;
            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: def,
            });
            const sha = branch.commit.sha;
            core.info(`--- Checks on default branch (${def}) @ ${sha.slice(0, 7)} ---`);

            const checkRuns = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                page,
              });
              const chunk = data.check_runs || [];
              checkRuns.push(...chunk);
              if (chunk.length < 100) break;
            }
            for (const run of checkRuns) {
              const app = run.app?.slug || run.app?.name || "?";
              core.info(
                `check: ${run.name} | ${run.status}/${run.conclusion ?? "-"} | app=${app}`,
              );
            }
            if (!checkRuns.length) core.info("(no check runs on this SHA)");

            try {
              const { data: comb } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: sha,
              });
              core.info(
                `--- Combined commit status: ${comb.state} (${comb.statuses?.length ?? 0} entries) ---`,
              );
              for (const s of comb.statuses || []) {
                core.info(`status: ${s.context} = ${s.state} | ${s.description || ""}`);
              }
            } catch (e) {
              core.info(`Combined status API: ${e.message}`);
            }

            let remainingFail = 0;
            const samples = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              const runs = data.workflow_runs || [];
              for (const r of runs) {
                if (r.conclusion !== "failure") continue;
                remainingFail++;
                if (samples.length < 30)
                  samples.push(`${r.path || "?"} #${r.id} ${r.head_sha?.slice(0, 7)}`);
              }
              if (runs.length < 100) break;
            }
            if (remainingFail)
              core.warning(
                `Remaining failed Actions runs in repo: ${remainingFail}. Sample: ${samples.join(" | ")}`,
              );
            else core.info("No failed Actions workflow runs left in full repo scan.");
            core.info("Done.");
