# 零输入：从 7e5debfc…（含）到 HEAD，重跑全部失败的 Cloudflare check_run。
# 注意：不能用「派发另一个 workflow」——GITHUB_TOKEN 触发的派发不会真正启动子 workflow。
# 改起点：编辑下方 SINCE_SHA。
name: Cloudflare 一键重跑（7e5deb→HEAD）

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-oneclick-7e5deb
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

jobs:
  rerequest:
    runs-on: ubuntu-latest
    steps:
      - name: 从起始 commit 扫到 HEAD 并 rerequest（同一次 run 内完成）
        uses: actions/github-script@v8
        with:
          script: |
            const SINCE_SHA = "7e5debfcae0763ff75308ad4dd54bce121f757e1";
            const branch = "main";
            const MAX_WALK = 5000;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let sinceFull;
            try {
              const { data } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: SINCE_SHA,
              });
              sinceFull = data.sha;
            } catch (e) {
              core.setFailed(`无法解析起始 commit: ${e.message}`);
              return;
            }

            const shas = [];
            let walked = 0;
            let page = 1;
            let found = false;

            while (!found && walked < MAX_WALK) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: branch,
                per_page: 100,
                page,
              });
              if (!commits.length) break;

              for (const c of commits) {
                shas.push(c.sha);
                walked++;
                if (c.sha === sinceFull) {
                  found = true;
                  break;
                }
              }

              if (found) break;
              if (commits.length < 100) break;
              page++;
            }

            if (!found) {
              core.setFailed(
                `从 main HEAD 往回未找到 ${sinceFull.slice(0, 7)}（或超过 ${MAX_WALK} 条）。`,
              );
              return;
            }

            core.info(`区间: ${sinceFull.slice(0, 7)}…HEAD，共 ${shas.length} 个 commit`);

            const BAD_CONCLUSIONS = new Set([
              "failure",
              "timed_out",
              "cancelled",
              "action_required",
              "startup_failure",
              "stale",
            ]);

            function isCloudflareRelated(run) {
              const app = ((run.app && run.app.name) || "").toLowerCase();
              const slug = ((run.app && run.app.slug) || "").toLowerCase();
              const nm = (run.name || "").toLowerCase();
              if (slug.includes("cloudflare")) return true;
              if (app.includes("cloudflare")) return true;
              if (nm.includes("cloudflare")) return true;
              return false;
            }

            function shouldRerequestRun(run) {
              if (!run || run.status !== "completed") return false;
              if (!BAD_CONCLUSIONS.has(run.conclusion || "")) return false;
              return isCloudflareRelated(run);
            }

            /** @type {Map<number, unknown>} */
            const byId = new Map();

            for (const sha of shas) {
              for await (const res of github.paginate.iterator(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: sha,
                per_page: 100,
              })) {
                for (const run of res.data.check_runs || []) {
                  if (!shouldRerequestRun(run)) continue;
                  const rid = run.id;
                  if (rid == null) continue;
                  byId.set(Number(rid), true);
                }
              }
            }

            let ids = [...byId.keys()].sort((a, b) => b - a);
            core.info(`待 rerequest: ${ids.length} 个唯一失败 Cloudflare check_run`);

            if (!ids.length) {
              async function diagForSha(sha, label) {
                let md = `### ${label} \`${sha.slice(0, 7)}\`\n\n`;
                const lines = [];
                try {
                  const { data } = await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: sha,
                    per_page: 100,
                  });
                  const runs = data.check_runs || [];
                  lines.push(`**Checks API**: ${runs.length} 条`);
                  md += `| conclusion | status | app.slug | app.name | name |\n|:---|:---|:---|:---|:---|\n`;
                  for (const r of runs.slice(0, 40)) {
                    const slug = (r.app && r.app.slug) || "";
                    const an = (r.app && r.app.name) || "";
                    md += `| ${r.conclusion || "—"} | ${r.status} | ${slug} | ${an} | ${(r.name || "").replace(/\|/g, "/")} |\n`;
                  }
                  if (runs.length > 40) md += `\n（仅列前 40 条）\n`;
                } catch (e) {
                  md += `Checks 读取失败: ${e.message}\n`;
                }
                try {
                  const { data: st } = await github.rest.repos.listCommitStatusesForRef({
                    owner,
                    repo,
                    ref: sha,
                    per_page: 100,
                  });
                  md += `\n**Commit statuses**（旧式红叉可能只在这里）: ${st.length} 条\n\n`;
                  md += `| state | context |\n|:---|:---|\n`;
                  for (const s of st.slice(0, 30)) {
                    md += `| ${s.state} | ${(s.context || "").replace(/\|/g, "/")} |\n`;
                  }
                } catch (e) {
                  md += `\nStatuses 读取失败: ${e.message}\n`;
                }
                return md;
              }

              const headSha = shas[0];
              const tailSha = shas[shas.length - 1];
              const d1 = await diagForSha(headSha, "最新提交 HEAD 侧");
              const d2 = await diagForSha(tailSha, "区间内最旧提交");

              await core.summary
                .addRaw(
                  `## 无匹配 check_run（可 rerequest）\n\n` +
                    `在 **${shas.length}** 个 commit 上，按「Cloudflare 相关 + 失败类 conclusion」未找到条目。\n\n` +
                    `可能原因：1) 红叉已是 **success**；2) 失败记在 **Commit status** 而非 Check run（下方可查）；3) App 名不含 cloudflare（把日志发给维护者改匹配）。\n\n` +
                    d1 +
                    "\n\n" +
                    d2 +
                    `\n\n> Check run 才能用 API rerequest；若只有 **status** 失败，请到 **Cloudflare Dashboard → Pages → Deployments** 手动 Retry。`,
                )
                .write();
              return;
            }

            const batchSize = 15;
            let ok = 0;
            let bad = 0;
            for (let i = 0; i < ids.length; i += batchSize) {
              const batch = ids.slice(i, i + batchSize);
              const results = await Promise.all(
                batch.map(async (check_run_id) => {
                  try {
                    await github.request("POST /repos/{owner}/{repo}/check-runs/{check_run_id}/rerequest", {
                      owner,
                      repo,
                      check_run_id,
                    });
                    return { check_run_id, ok: true, err: null };
                  } catch (e) {
                    return { check_run_id, ok: false, err: e.message };
                  }
                }),
              );
              for (const r of results) {
                if (r.ok) {
                  ok++;
                  core.info(`ok check_run_id=${r.check_run_id}`);
                } else {
                  bad++;
                  core.warning(`fail check_run_id=${r.check_run_id}: ${r.err}`);
                }
              }
              if (i + batchSize < ids.length) await new Promise((t) => setTimeout(t, 400));
            }

            const line = `完成：成功 **${ok}**，失败 **${bad}**，共 **${ids.length}** 个 check_run；commit 数 **${shas.length}**。`;
            await core.summary.addRaw(`## ${line}`).write();
            core.info(line);
            if (bad > 0) core.setFailed(`部分 rerequest 失败：${bad} 个`);
