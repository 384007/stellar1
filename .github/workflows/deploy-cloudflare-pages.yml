# Cloudflare Pages **生产**部署（含 next-on-pages 生成的 Pages Functions / Worker）。
# 与「仅预览分支」不同：不使用 --branch，即发布到项目的 Production。
#
# Secrets：CLOUDFLARE_API_TOKEN（Account · Cloudflare Pages · Edit）
#
# 触发后请到 GitHub：Actions → 本 workflow → 最新 run（run 标题含短 SHA）。
# 仓库远程应为 github.com/dytsui/stellar1（与本地文件夹名无关）。
# Deploy bump: main 已含 d0e4dd95b7d39391ef1e7b782a0fcb47da93512c；本注释用于触发新的生产构建（非空提交）。
name: Deploy Cloudflare Pages (production)

run-name: "CF Pages prod ${{ github.sha }}"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # 同一时刻只保留最后一次生产发布，避免并行写乱序
  group: cloudflare-pages-production
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Build and deploy Pages + Worker (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Pages (next-on-pages → static + worker bundle)
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "[pages] ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA} → production"
          npm run pages:deploy
