# Cloudflare Pages：push 到 main 部署生产；push 到 feat/** 部署预览分支（不覆盖生产）。
# 需在仓库 Secrets 配置：CLOUDFLARE_API_TOKEN（Account · Cloudflare Pages · Edit）。
# Next 构建若缺环境变量，在仓库 Variables/Secrets 中补齐（与本地 build 一致）。
name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 若构建需要 NEXT_PUBLIC_*，在仓库 Settings → Variables 配置并在下方 env 中引用。
      - name: Build Next.js
        run: npm run build

      - name: Build Pages (next-on-pages)
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages (production)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run pages:deploy

      - name: Deploy to Cloudflare Pages (preview branch)
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "[pages] preview branch=$SAFE_BRANCH"
          npx wrangler pages deploy .vercel/output/static --branch="$SAFE_BRANCH" --commit-dirty=true
