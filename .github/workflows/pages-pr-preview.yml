name: Frontend PR Preview

# 自动部署触发说明（需在仓库 Settings → Actions → General 中允许 Actions，且配置 CLOUDFLARE_* secrets）：
# - pull_request：PR 打开、新提交、重新打开、草稿 → 可审查（ready_for_review）时各跑一次（任意文件变更均重建预览）
# - push：非 main/master 分支任意推送均重建预览（与后端/Modal 联调时不必再改 frontend 才触发）
# - push 与 pull_request 可能对同一 commit 各触发一次 → concurrency 按 sha 合并为一次执行
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build (e.g. feat/modal-centric-backend-proxies)'
        required: true
        type: string
      preview_branch:
        description: 'Cloudflare Pages --branch (e.g. pr-50)'
        required: true
        default: 'pr-50'
        type: string
      pr_number:
        description: 'Optional: PR number to post preview URL as a comment (e.g. 50)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stellar1-pages-preview-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-preview:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Gate — skip if Cloudflare token missing
        id: gate
        working-directory: .
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping Pages preview deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Cloudflare Pages output
        if: steps.gate.outputs.skip != 'true'
        run: npm run pages:build

      - name: Deploy PR preview
        id: deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.preview_branch }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          else
            # push：feat/modal-centric-backend-proxies → pr-50
            REF_NAME="${{ github.ref_name }}"
            if [ "$REF_NAME" = "feat/modal-centric-backend-proxies" ]; then
              BRANCH_NAME="pr-50"
            else
              SAFE=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' | cut -c1-48)
              BRANCH_NAME="push-${SAFE}"
            fi
          fi
          echo "Using Cloudflare Pages branch: $BRANCH_NAME"
          LOG_FILE="$RUNNER_TEMP/wrangler-preview.log"
          npx wrangler pages deploy .vercel/output/static \
            --project-name stellar1 \
            --branch "$BRANCH_NAME" \
            --commit-dirty=true 2>&1 | tee "$LOG_FILE"
          PREVIEW_URL=$(grep -Eo 'https://[^ ]+\.(pages|workers)\.dev[^ ]*' "$LOG_FILE" | tail -n1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -Eo 'https://[^ ]+pages\.dev[^ ]*' "$LOG_FILE" | tail -n1 || true)
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          # Cloudflare Pages preview branch alias: <branch>.<project>.pages.dev (slashes → hyphens, lowercased).
          ALIAS_SLUG=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-//;s/-$//')
          echo "preview_alias_url=https://${ALIAS_SLUG}.stellar1.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Wrangler log URL (if any): ${PREVIEW_URL:-<not parsed>}"
          echo "Pages preview branch alias (open this to test): https://${ALIAS_SLUG}.stellar1.pages.dev"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Could not parse a URL from wrangler log; use the branch alias above or Cloudflare → stellar1 → Deployments.'
          fi

      - name: Comment preview link on PR
        if: >-
          ${{
            steps.gate.outputs.skip != 'true' &&
            steps.deploy.outputs.preview_alias_url != '' &&
            github.event_name == 'pull_request'
          }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.preview_alias_url }}
        with:
          script: |
            const direct = (process.env.PREVIEW_URL || '').trim();
            const alias = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const body = [
              'Frontend PR preview deployed.',
              '',
              '**Test URL (branch alias, always try this first):**',
              alias,
              '',
              ...(direct ? ['**Also printed by wrangler (if parsed):**', direct, ''] : []),
              'Suggested smoke test:',
              '- `/analyze` → upload a short video → wait for result',
              '- `/login` if APIs return 401',
              '',
              'If upload or analysis returns 503, open Cloudflare → Pages → stellar1 → Settings and ensure **Preview** env matches Production (JWT_SECRET, BACKEND_URL, R2, D1, MODAL_BACKEND_URL / LITE_BACKEND_URL, Gemini keys).'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Comment preview link (manual run)
        if: >-
          ${{
            steps.gate.outputs.skip != 'true' &&
            steps.deploy.outputs.preview_alias_url != '' &&
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.pr_number != ''
          }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.preview_alias_url }}
        with:
          script: |
            const direct = (process.env.PREVIEW_URL || '').trim();
            const alias = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const n = Number.parseInt('${{ github.event.inputs.pr_number }}', 10);
            if (!Number.isFinite(n) || n <= 0) {
              core.setFailed('Invalid pr_number');
              return;
            }
            const body = [
              'Frontend PR preview (manual workflow run).',
              '',
              '**Test URL (branch alias):**',
              alias,
              '',
              ...(direct ? ['**Wrangler log URL:**', direct, ''] : []),
              'Smoke: `/analyze` → upload video; `/login` if 401.',
              '',
              '503 on upload/analyze → align **Preview** secrets with Production on Pages project stellar1.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body,
            });
