name: Frontend PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-pr-preview.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build (e.g. feat/modal-centric-backend-proxies)'
        required: true
        type: string
      preview_branch:
        description: 'Cloudflare Pages --branch (e.g. pr-50)'
        required: true
        default: 'pr-50'
        type: string
      pr_number:
        description: 'Optional: PR number to post preview URL as a comment (e.g. 50)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  pages-preview:
    if: >-
      ${{
        secrets.CLOUDFLARE_API_TOKEN != '' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        )
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Cloudflare Pages output
        run: npm run pages:build

      - name: Deploy PR preview
        id: deploy
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.preview_branch }}"
          else
            BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          fi
          echo "Using Cloudflare Pages branch: $BRANCH_NAME"
          LOG_FILE="$RUNNER_TEMP/wrangler-preview.log"
          npx wrangler pages deploy .vercel/output/static \
            --project-name stellar1 \
            --branch "$BRANCH_NAME" \
            --commit-dirty=true 2>&1 | tee "$LOG_FILE"
          PREVIEW_URL=$(grep -Eo 'https://[^ ]+\.(pages|workers)\.dev[^ ]*' "$LOG_FILE" | tail -n1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -Eo 'https://[^ ]+pages\.dev[^ ]*' "$LOG_FILE" | tail -n1 || true)
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          # Cloudflare Pages preview branch alias: <branch>.<project>.pages.dev (slashes → hyphens, lowercased).
          ALIAS_SLUG=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-//;s/-$//')
          echo "preview_alias_url=https://${ALIAS_SLUG}.stellar1.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Wrangler log URL (if any): ${PREVIEW_URL:-<not parsed>}"
          echo "Pages preview branch alias (open this to test): https://${ALIAS_SLUG}.stellar1.pages.dev"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Could not parse a URL from wrangler log; use the branch alias above or Cloudflare → stellar1 → Deployments.'
          fi

      - name: Comment preview link on PR
        if: ${{ steps.deploy.outputs.preview_alias_url != '' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.preview_alias_url }}
        with:
          script: |
            const direct = (process.env.PREVIEW_URL || '').trim();
            const alias = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const body = [
              'Frontend PR preview deployed.',
              '',
              '**Test URL (branch alias, always try this first):**',
              alias,
              '',
              ...(direct ? ['**Also printed by wrangler (if parsed):**', direct, ''] : []),
              'Suggested smoke test:',
              '- `/analyze` → upload a short video → wait for result',
              '- `/login` if APIs return 401',
              '',
              'If upload or analysis returns 503, open Cloudflare → Pages → stellar1 → Settings and ensure **Preview** env matches Production (JWT_SECRET, R2, D1, MODAL_BACKEND_URL / LITE_BACKEND_URL, Gemini keys).'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Comment preview link (manual run)
        if: >-
          ${{
            steps.deploy.outputs.preview_alias_url != '' &&
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.pr_number != ''
          }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.preview_alias_url }}
        with:
          script: |
            const direct = (process.env.PREVIEW_URL || '').trim();
            const alias = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const n = Number.parseInt('${{ github.event.inputs.pr_number }}', 10);
            if (!Number.isFinite(n) || n <= 0) {
              core.setFailed('Invalid pr_number');
              return;
            }
            const body = [
              'Frontend PR preview (manual workflow run).',
              '',
              '**Test URL (branch alias):**',
              alias,
              '',
              ...(direct ? ['**Wrangler log URL:**', direct, ''] : []),
              'Smoke: `/analyze` → upload video; `/login` if 401.',
              '',
              '503 on upload/analyze → align **Preview** secrets with Production on Pages project stellar1.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body,
            });
