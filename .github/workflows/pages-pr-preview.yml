name: Frontend PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-pr-preview.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pages-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Cloudflare Pages output
        run: npm run pages:build

      - name: Deploy PR preview
        id: deploy
        run: |
          set -eo pipefail
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          LOG_FILE="$RUNNER_TEMP/wrangler-preview.log"
          npx wrangler pages deploy .vercel/output/static \
            --project-name stellar-ai \
            --branch "$BRANCH_NAME" \
            --commit-dirty=true 2>&1 | tee "$LOG_FILE"
          PREVIEW_URL=$(grep -Eo 'https://[^ ]+\.(pages|workers)\.dev[^ ]*' "$LOG_FILE" | tail -n1 || true)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Could not detect preview URL from wrangler output.'
          fi

      - name: Comment preview link on PR
        if: ${{ steps.deploy.outputs.preview_url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ toJson(steps.deploy.outputs.preview_url) }}`;
            const body = [
              'Frontend PR preview is ready:',
              '',
              url,
              '',
              'Suggested smoke test:',
              '- open `/analyze`',
              '- upload a video in Lite / Pro / Plus',
              '- confirm analysis completes instead of only spinning or erroring'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
