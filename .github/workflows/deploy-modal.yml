name: Deploy to Modal

# main：生产发布；feat/**：功能分支推送时同步重部署（便于联调 Modal，无需等合并 main）
on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'modal_app.py'
      - 'backend/**'
      - 'tools/modal_bake_yolo.py'
      - 'tools/modal_bake_swingnet.py'
      - 'backend/requirements-modal.txt'
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:

concurrency:
  group: deploy-modal-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy stellar-ai to Modal
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal

      # Pro v3 MCI: modal_app forces FAST_240FPS=0 + ALLOW_MINTERPOLATE_ON_MODAL=1 at worker start; build checks ffmpeg minterpolate.
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # Inline checkout SHA so image bake always matches this push (no stale GITHUB_ENV).
          export STELLAR_GIT_SHA="${{ github.sha }}"
          export STELLAR_GIT_BRANCH="${{ github.ref_name }}"
          export STELLAR_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[deploy-modal] STELLAR_GIT_SHA=$STELLAR_GIT_SHA STELLAR_GIT_BRANCH=$STELLAR_GIT_BRANCH"
          python -m modal deploy modal_app.py
