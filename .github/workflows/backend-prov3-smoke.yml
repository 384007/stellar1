# Fast, dependency-light check: Pro v3 routes must appear in OpenAPI and analyze validates input.
name: Backend Pro v3 smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-prov3-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-prov3-smoke.yml"

jobs:
  prov3-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pro v3 OpenAPI + analyze validation
        env:
          JWT_SECRET: ci-test-secret-prov3-smoke
        run: python -m unittest discover -s tests -p "test_prov3_routes_smoke.py" -v
